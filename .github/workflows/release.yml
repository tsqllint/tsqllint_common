name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-dotnet@3951f0dfe7a714d785938fb57c4ffd2c3e1a5b1c  # v4.3.0
        with:
          dotnet-version: '8.x'
      - run: dotnet restore TSQLLint.Common.sln
      - run: dotnet build TSQLLint.Common.sln --configuration Release --no-restore /p:Version=${{ github.ref_name }}
      - run: dotnet test TSQLLint.Common.sln --no-restore
      - run: dotnet pack TSQLLint.Common.sln --configuration Release --no-build -p:PackageVersion=${{ github.ref_name }} --output artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: artifacts
          path: artifacts/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/setup-dotnet@3951f0dfe7a714d785938fb57c4ffd2c3e1a5b1c  # v4.3.0
        with:
          dotnet-version: '8.x'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: artifacts
          path: artifacts/
      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/TSQLLint.Common.${{ github.ref_name }}.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          generate_release_notes: true
